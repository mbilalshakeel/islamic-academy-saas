name: ici_platform_app
description: "ICI Multi-Tenant White-Label Islamic Academy — Flutter mobile app (Android + iOS)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # Supabase backend (same production backend + RLS as the web app)
  supabase_flutter: ^2.8.0

  # State management
  flutter_riverpod: ^2.6.1

  # Local caching / offline
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3

  # Firebase Cloud Messaging (push notifications)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^17.2.4

  # Networking (Aladhan Sehri/Iftar API)
  http: ^1.2.2

  # URLs (PDF viewer, contact links)
  url_launcher: ^6.3.1

  # Fonts (Arabic/Urdu/UI via Google Fonts)
  google_fonts: ^6.2.1

  # Localization / intl
  intl: ^0.19.0

  # Hijri calendar / date conversions
  hijri: ^3.0.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
